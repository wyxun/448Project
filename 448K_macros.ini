# Client 调试宏：名称 = MShell 指令
# 注释单独成行，避免被当作指令参数发送。

# 切换 Trace 日志开关（重复执行会再次切换）。
mlog T = log -T
# 手动读取各通道原始 ADC 值。
read adc = adc read

# 开环：直接输出目标能量，不根据接触状态切换低能量。
# 能量范围 0..1000，200 表示 20% 控制量，并非实测输出功率。
448K_Cap = rf448 start cap open 200
448K_Res = rf448 start res open 200
# 运行中更新能量：必须保持相同探头和控制模式。
448K_Cap_Energy = rf448 start cap open 300
448K_Res_Energy = rf448 start res open 300

# 闭环：先以低能量运行，确认接触后输出目标，释放后退回低能量。
# 当前低能量上限为 200，目标设为 300 才能观察到能量切换。
448K_Cap_Closed = rf448 start cap close 200
448K_Res_Closed = rf448 start res close 200
448K_Cap_Closed_Energy = rf448 start cap close 300
448K_Res_Closed_Energy = rf448 start res close 300

# 停止 RF 输出、复位探头继电器并关闭风扇；切换头/模式前先停止。
448K_Stop = rf448 stop
# 查看状态、模式、目标/实际能量、输入标志和母线电压。
448K_Status = rf448 status
# 开环/闭环均保留 MOS 过温保护；母线检查由驱动宏开关控制。
